<div class="page">
  <header class="page-header">
    <div>
      <a class="back-link" routerLink="/administration"><i class="pi pi-arrow-left"></i>Адміністрування</a>
      <h1 class="page-title">Регіони</h1>
      <p class="page-subtitle">Керуйте регіонами компанії</p>
    </div>
    <div class="toolbar">
      <p-iconfield styleClass="search">
        <p-inputicon styleClass="pi pi-search"/>
        <input pInputText placeholder="Пошук регіону" aria-label="Пошук регіону"
               [value]="search()" (input)="search.set($any($event.target).value)" [fluid]="true"/>
      </p-iconfield>
      <p-button label="Додати регіон" icon="pi pi-plus" (onClick)="openDialog()"/>
    </div>
  </header>

  <section class="content glass">
    <div class="surface content-surface">
      <p-table [value]="filteredUnits()" dataKey="id" [loading]="isLoading()" [rowHover]="true"
               sortField="name" [sortOrder]="1" styleClass="structure-table">
        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="code" style="width: 120px">Код <p-sortIcon field="code"/></th>
            <th pSortableColumn="name">Назва <p-sortIcon field="name"/></th>
            <th>Опис</th>
            <th class="col-actions"></th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-unit>
          <tr>
            <td><p-tag [value]="unit.code" severity="secondary"/></td>
            <td class="name">{{ unit.name }}</td>
            <td class="muted">{{ unit.description }}</td>
            <td class="col-actions">
              <div class="row-actions">
                <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="secondary"
                          ariaLabel="Редагувати" pTooltip="Редагувати" tooltipPosition="top" (onClick)="openDialog(unit)"/>
                <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger"
                          ariaLabel="Видалити" pTooltip="Видалити" tooltipPosition="top" (onClick)="confirmDelete(unit)"/>
              </div>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="4">
              @if (search()) {
                <app-empty-state icon="pi pi-map" heading="Нічого не знайдено" hint="Спробуйте інший запит"/>
              } @else {
                <app-empty-state icon="pi pi-map" heading="Регіонів ще немає" hint="Додайте перший регіон, щоб створювати в ньому департаменти"/>
              }
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </section>
</div>
