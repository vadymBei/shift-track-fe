<div class="page">
  <header class="page-header">
    <div>
      <a class="back-link" routerLink="/administration"><i class="pi pi-arrow-left"></i>Адміністрування</a>
      <h1 class="page-title">Посади</h1>
      <p class="page-subtitle">Посади працівників і погодинні ставки</p>
    </div>
    <div class="toolbar">
      <p-iconfield styleClass="search">
        <p-inputicon styleClass="pi pi-search"/>
        <input pInputText placeholder="Пошук посади" aria-label="Пошук посади"
               [value]="search()" (input)="search.set($any($event.target).value)" [fluid]="true"/>
      </p-iconfield>
      <p-button label="Додати посаду" icon="pi pi-plus" (onClick)="openDialog()"/>
    </div>
  </header>

  <section class="content glass">
    <div class="surface content-surface">
      <p-table [value]="filteredPositions()" dataKey="id" [loading]="isLoading()" [rowHover]="true"
               sortField="name" [sortOrder]="1" styleClass="structure-table">
        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="name">Назва <p-sortIcon field="name"/></th>
            <th>Опис обов'язків</th>
            <th class="num" pSortableColumn="hourlyRate">Ставка <p-sortIcon field="hourlyRate"/></th>
            <th class="col-actions"></th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-position>
          <tr>
            <td class="name">{{ position.name }}</td>
            <td class="muted">{{ position.description }}</td>
            <td class="num"><b>{{ position.hourlyRate }}</b><span class="muted">&nbsp;₴/год</span></td>
            <td class="col-actions">
              <div class="row-actions">
                <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="secondary"
                          ariaLabel="Редагувати" pTooltip="Редагувати" tooltipPosition="top" (onClick)="openDialog(position)"/>
                <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger"
                          ariaLabel="Видалити" pTooltip="Видалити" tooltipPosition="top" (onClick)="confirmDelete(position)"/>
              </div>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="4">
              @if (search()) {
                <app-empty-state icon="pi pi-id-card" heading="Нічого не знайдено" hint="Спробуйте інший запит"/>
              } @else {
                <app-empty-state icon="pi pi-id-card" heading="Посад ще немає" hint="Додайте першу посаду зі ставкою"/>
              }
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </section>
</div>
