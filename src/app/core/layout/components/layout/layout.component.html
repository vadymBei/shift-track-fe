<div class="app-shell">
  <aside class="app-sidebar glass" [class.collapsed]="collapsed()">
    <app-sidebar [collapsed]="collapsed()" (toggleCollapse)="toggleCollapsed()"/>
  </aside>

  <div class="app-main">
    <app-header class="app-topbar" (menuClick)="drawerVisible.set(true)"/>

    <main class="app-content">
      <router-outlet/>
    </main>
  </div>
</div>

<p-drawer
  [visible]="drawerVisible()"
  (visibleChange)="drawerVisible.set($event)"
  position="left"
  styleClass="app-drawer">
  <ng-template pTemplate="headless">
    <app-sidebar [collapsible]="false" (navigate)="drawerVisible.set(false)"/>
  </ng-template>
</p-drawer>
