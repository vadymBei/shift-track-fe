<div class="sidebar" [class.collapsed]="collapsed()">
  <div class="sidebar-brand">
    <img class="brand-logo" src="/assets/icons/cube.svg" alt="">
    @if (!collapsed()) {
      <span class="brand-name">ShiftTrack</span>
    }
  </div>

  <nav class="sidebar-nav" aria-label="Головне меню">
    @if (isUserLoaded()) {
      @for (item of menuItems(); track item.link) {
        <a
          pRipple
          class="nav-link"
          [routerLink]="item.link"
          routerLinkActive="active"
          [attr.aria-label]="collapsed() ? item.label : null"
          [pTooltip]="item.label"
          [tooltipDisabled]="!collapsed()"
          tooltipPosition="right"
          (click)="navigate.emit()">
          <i [class]="item.icon"></i>
          @if (!collapsed()) {
            <span class="nav-label">{{ item.label }}</span>
          }
          @if (badgeCount(item); as count) {
            <span class="nav-badge" [attr.aria-label]="count + ' чекають рішення'">{{ collapsed() ? '' : count }}</span>
          }
        </a>
      }
    } @else {
      @for (i of skeletonItems; track i) {
        <p-skeleton height="40px" borderRadius="10px"/>
      }
    }
  </nav>

  <div class="sidebar-footer">
    <app-user-menu [compact]="collapsed()"/>

    <div class="footer-actions">
      <app-theme-toggle/>
      @if (collapsible()) {
        <p-button
          [icon]="collapsed() ? 'pi pi-angle-double-right' : 'pi pi-angle-double-left'"
          [rounded]="true"
          [text]="true"
          severity="secondary"
          [ariaLabel]="collapsed() ? 'Розгорнути меню' : 'Згорнути меню'"
          [pTooltip]="collapsed() ? 'Розгорнути меню' : 'Згорнути меню'"
          tooltipPosition="right"
          (onClick)="toggleCollapse.emit()"/>
      }
    </div>
  </div>
</div>
