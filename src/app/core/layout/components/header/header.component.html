<header class="topbar glass">
  <p-button
    icon="pi pi-bars"
    [rounded]="true"
    [text]="true"
    severity="secondary"
    ariaLabel="Відкрити меню"
    (onClick)="menuClick.emit()"/>

  <div class="brand">
    <img class="brand-logo" src="/assets/icons/cube.svg" alt="">
    <span class="brand-name">ShiftTrack</span>
  </div>

  <div class="topbar-end">
    <app-notification-bell/>
    <app-theme-toggle/>
    <app-user-menu [compact]="true"/>
  </div>
</header>
